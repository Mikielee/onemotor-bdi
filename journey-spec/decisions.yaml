- id: OD-1
  question: How to handle contact update against an active proposal (stale proposal
    can be paid through any channel with no check at point of payment; claims and
    data-integrity risk)
  source: Contact validation meeting with IT (Chou Wee, Andy, Stanley), 29 Jun 2026;
    minutes circulated 3 Jul 2026
  owner: IT + Oliver
  status: pending
  current-implementation: prototype ignores it — no proposal-vs-contact cross-check
    anywhere in Steps 12-17
  notes: IT position is any check should be a new IDIT API, not a middleware chain.
    Lighter alternative discussed (validate before purchase + cross-check at point
    of purchase) not adopted; part 2 likely not feasible for December.
  affects: [step-12, step-14, step-15, payment-gateway]

